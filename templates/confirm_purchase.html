<!DOCTYPE html>
<html>
<head>
  <title>Confirm Purchase</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
  </style>
</head>
<body>
  <h2>Confirm Purchase</h2>
  <p><strong>Name:</strong> {{ student.full_name }}</p>
  <p><strong>School ID:</strong> {{ student.school_id }}</p>
  <p><strong>Grade Level:</strong> {{ student.grade_level }}</p>
  <p><strong>Strand:</strong> {{ student.strand }}</p>
  <p><strong>Balance:</strong> ₱{{ student.balance }}</p>

  <form method="POST" action="{{ url_for('process_purchase', student_id=student.student_id) }}">
    <label>Amount:</label>
    <input type="number" name="amount" required>
    <button type="submit">Confirm Purchase</button>
  </form>
</body>
</html>
