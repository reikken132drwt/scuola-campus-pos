<!DOCTYPE html>
<html>
<head>
  <title>Confirm Signup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }
    .confirm-container {
      max-width: 400px;
      margin: 80px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .logo img {
      width: 100px;
      margin-bottom: 20px;
    }
    h2 {
      color: #d32f2f; /* FCD logo red tone */
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
      text-align: left;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 3px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #d32f2f;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #b71c1c;
    }
    .note {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
  </style>
</head>
<body>
  <div class="confirm-container">
    <!-- 🔹 FCD Logo -->
    <div class="logo">
      <img src="{{ url_for('static', filename='images/fcd_logo.png') }}" alt="FCD Logo">
    </div>

    <h2>Confirm Your Signup</h2>
    <form action="{{ url_for('confirm_signup') }}" method="POST">
      <label for="otp">Enter Confirmation Code:</label>
      <input type="text" id="otp" name="otp" maxlength="6" required>
      <button type="submit">Confirm</button>
    </form>
    <p class="note">A confirmation code has been sent to your email ({{ email }}). Please enter it above to complete your signup.</p>
  </div>
</body>
</html>
