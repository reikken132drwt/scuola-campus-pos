<!DOCTYPE html>
<html>
<head>
  <title>Staff Forgot Password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
  </style>
</head>
<body>
  <h2>Reset Staff Password</h2>
  <form action="{{ url_for('forgot_password_staff') }}" method="POST">
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required><br>

    <label for="security_q1">Security Question 1:</label>
    <input type="text" id="security_q1" name="security_q1" required><br>
    <input type="text" id="security_a1" name="security_a1" required><br>

    <label for="security_q2">Security Question 2:</label>
    <input type="text" id="security_q2" name="security_q2" required><br>
    <input type="text" id="security_a2" name="security_a2" required><br>

    <label for="security_q3">Security Question 3:</label>
    <input type="text" id="security_q3" name="security_q3" required><br>
    <input type="text" id="security_a3" name="security_a3" required><br>

    <label for="new_password">New Password:</label>
    <input type="password" id="new_password" name="new_password" required><br>

    <button type="submit">Reset Password</button>
  </form>
</body>
</html>
