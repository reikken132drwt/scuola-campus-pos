<!doctype html>
<html>
<head><title>Transactions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
  </style>
</head>
<body>
  <h1>Transactions</h1>
  <table border="1">
    <tr><th>ID</th><th>Student ID</th><th>Type</th><th>Amount</th><th>Timestamp</th></tr>
    {% for t in transactions %}
    <tr>
      <td>{{ t.transaction_id }}</td>
      <td>{{ t.student_id }}</td>
      <td>{{ t.type }}</td>
      <td>{{ t.amount }}</td>
      <td>{{ t.timestamp }}</td>
    </tr>
    {% endfor %}
  </table>
  <a href="/dashboard">Back</a>
</body>
</html>
