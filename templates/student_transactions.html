<!DOCTYPE html>
<html>
<head>
  <title>Student Transaction History</title>
  <style>
    .main-content {
      margin-left: 220px; /* same as sidebar width */
      padding: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #1E3A8A;
      color: white;
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
  </style>
</head>
<body>

  {% include 'sidebar.html' %}

  <div class="main-content">
    <h2>Transaction History</h2>

    <!-- Filter Form -->
    <form method="GET" action="{{ url_for('dashboard_transactions') }}">
      <label>Filter by Date:</label>
      <input type="date" name="start_date" value="{{ request.args.get('start_date','') }}">
      <input type="date" name="end_date" value="{{ request.args.get('end_date','') }}">
      <button type="submit">Filter</button>
    </form>

    <!-- Transactions Table -->
    <table>
      <tr>
        <th>Type</th>
        <th>Amount</th>
        <th>Date</th>
        <th>Performed By</th>
      </tr>
      {% for t in transactions %}
      <tr>
        <td>{{ t.type }}</td>
        <td>₱{{ t.amount }}</td>
        <td>{{ t.created_at }}</td>
        <td>{{ t.performed_by }}</td>
      </tr>
      {% endfor %}
    </table>

    <br>
    <a href="{{ url_for('download_transactions_pdf') }}" class="btn btn-secondary">Download as PDF</a>
  </div>

</body>
</html>
