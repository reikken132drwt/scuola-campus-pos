<!DOCTYPE html>
<html>
<head>
    <title>Scan QR</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
  </style>
</head>
<body>
    <h2>Scan Canteen QR</h2>
    <div id="reader" style="width:300px"></div>

    <form id="scanForm" action="/scan_qr" method="POST">
        <input type="hidden" name="student_id" id="student_id">
        <input type="number" name="amount" placeholder="Amount" required>
        <button type="submit">Confirm Payment</button>
    </form>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById("student_id").value = decodedText;
            alert("QR Code scanned: " + decodedText);
        }

        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: 250 },
            onScanSuccess
        );
    </script>
</body>
</html>
