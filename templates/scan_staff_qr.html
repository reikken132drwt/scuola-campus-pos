<!DOCTYPE html>
<html>
<head>
    <title>Scan Staff QR</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
  </style>
</head>
<body>
    <h2>Scan Staff QR</h2>
    <div id="reader" style="width:300px"></div>

    <form id="scanForm" action="/scan_staff_qr" method="POST">
        <input type="hidden" name="staff_token" id="staff_token">
        <button type="submit">Confirm Scan</button>
    </form>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById("staff_token").value = decodedText;
            alert("Staff QR scanned: " + decodedText);
        }

        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: 250 },
            onScanSuccess
        );
    </script>
</body>
</html>
